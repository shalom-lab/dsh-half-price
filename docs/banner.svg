<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DeepSeek Peak and Idle Price plugin banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#1b2530"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fae72"/>
      <stop offset="1" stop-color="#64c98c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="60" r="120" fill="#3fae72" opacity="0.07"/>
  <circle cx="110" cy="250" r="90" fill="#e05a4e" opacity="0.06"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="118" fill="#f4f7fa" font-size="46" font-weight="700">DeepSeek Peak &amp; Idle Price</text>
    <text x="80" y="166" fill="#9fb0c0" font-size="22">One quiet chip under the composer. Peak or half price, at a glance.</text>

    <!-- idle chip -->
    <g transform="translate(80, 205)">
      <circle cx="24" cy="23" r="7" fill="#3fae72"/>
      <text x="42" y="30" fill="#3fae72" font-size="20" font-weight="600">Idle</text>
      <rect x="104" y="7" width="132" height="32" rx="16" fill="url(#green)"/>
      <text x="120" y="29" fill="#0f1720" font-size="17" font-weight="700">50% off</text>
    </g>

    <!-- peak chip -->
    <g transform="translate(360, 205)">
      <circle cx="24" cy="23" r="7" fill="#e05a4e"/>
      <text x="42" y="30" fill="#e05a4e" font-size="20" font-weight="600">Peak</text>
    </g>

    <text x="80" y="286" fill="#6f8092" font-size="15">2026–2027 holidays bundled · auto-synced from holiday-cn · zero dependencies · no build step</text>
  </g>
</svg>
